# Teddy Downloader — CT108 production deployment
#
# Architecture:
#   missav-dlp-web
#     Direct -> normal host internet
#     Proxy  -> free proxy pool
#     VPN    -> Gluetun HTTP proxy (:8888)
#
#   vpn-browser -> current jlesage desktop rollback; shares Gluetun's network namespace
#   vpn-browser-selkies -> production Selkies desktop; normal Compose network + Chrome proxy via Gluetun (:8888)
#   vpn-browser-mobile -> normal Compose network + Chromium proxy via Gluetun (:8888)
#
# Storage:
#   /downloads -> local CT108 NVMe work/state
#   /final     -> NAS NFS completed files
#
# Security:
#   - gluetun.env contains VPN credentials and MUST NOT be committed.
#   - gluetun-control-auth.toml MUST NOT be committed.
#   - Selkies Basic Auth credentials live outside this repository.
#   - TEDDY_IMAGE should be an immutable GHCR image tag.

services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun-missav
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    env_file:
      - ./gluetun.env
    environment:
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=wireguard
      - HTTPPROXY=on
      - FREE_ONLY=on
      - TZ=Asia/Seoul
    ports:
      - "58001:5800/tcp"
    volumes:
      - ./gluetun-control-auth.toml:/gluetun/auth/config.toml:ro

  missav-dlp-web:
    image: ${TEDDY_IMAGE:?TEDDY_IMAGE must be an immutable GHCR Teddy image}
    container_name: missav-dlp-web
    restart: unless-stopped
    depends_on:
      - gluetun
    environment:
      - TEDDY_FINAL_DIR=/final
      - TEDDY_BROWSER_URL=https://browser.ssikgun.com
      - TEDDY_MOBILE_BROWSER_URL=https://mobile-browser.ssikgun.com
      - GLUETUN_PROXY_URL=http://gluetun:8888
      - GLUETUN_CONTROL_URL=http://gluetun:8000
      - TEDDY_AUTH_DIR=/run/secrets/teddy-auth
      - TEDDY_AUTH_COOKIE_DOMAIN=.ssikgun.com
      - TEDDY_INTERNAL_DOWNLOAD_HOST=missav-dlp-web:5000
      - TEDDY_INTERNAL_DOWNLOAD_NET=172.18.0.0/16
    ports:
      - "58000:5000/tcp"
    volumes:
      - ./work:/downloads
      - /mnt/nas-downloads:/final
      - /opt/missav-dlp-web/teddy-auth:/run/secrets/teddy-auth:ro
      - /opt/missav-dlp-web/teddy-selkies-control:/run/secrets/teddy-selkies-control:ro

  vpn-browser:
    image: jlesage/chromium:latest
    container_name: missav-vpn-browser
    profiles:
      - legacy-browser
    restart: unless-stopped
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    environment:
      - TZ=Asia/Seoul
      - ENABLE_CJK_FONT=1
      - VNC_LISTENING_PORT=-1
      - KEEP_APP_RUNNING=1
      - SUP_GROUP_IDS=992
      - CHROMIUM_CUSTOM_ARGS=--load-extension=/config/teddy-downloader-extension
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    volumes:
      - ./vpn-browser-config:/config:rw

  vpn-browser-mobile:
    image: jlesage/chromium:latest
    container_name: missav-vpn-browser-mobile
    profiles:
      - legacy-mobile-browser
    restart: unless-stopped
    depends_on:
      - gluetun
      - missav-dlp-web
    environment:
      - TZ=Asia/Seoul
      - ENABLE_CJK_FONT=1
      - VNC_LISTENING_PORT=-1
      - KEEP_APP_RUNNING=1
      - DISPLAY_WIDTH=720
      - DISPLAY_HEIGHT=1300
      - SUP_GROUP_IDS=992
      - CHROMIUM_CUSTOM_ARGS=--load-extension=/config/teddy-downloader-extension --proxy-server=http://gluetun:8888
    ports:
      - "58003:5800/tcp"
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    volumes:
      - /opt/missav-mobile-browser-config:/config:rw

  vpn-browser-selkies:
    # Production runtime digest: sha256:9ce283f5f676dff47e78eb2e4bd6b10091b1678851f46df9f95a39bd67f8e6d5
    image: ghcr.io/ssikgun/missav-dlp-web@sha256:9ce283f5f676dff47e78eb2e4bd6b10091b1678851f46df9f95a39bd67f8e6d5
    build:
      context: .
      dockerfile: browser/selkies/Dockerfile
      args:
        CFT_VERSION: "152.0.7977.54"
    container_name: missav-vpn-browser-selkies
    hostname: missav-vpn-browser-selkies
    restart: unless-stopped
    depends_on:
      - gluetun
      - missav-dlp-web
    env_file:
      - /opt/missav-selkies-browser-config/selkies-auth.env
    environment:
      - SELKIES_ENABLE_BASIC_AUTH=false
      - TZ=Asia/Seoul
      - LIBVA_DRIVER_NAME=iHD
      - SELKIES_PORT=8080
      - SELKIES_MODE=websockets
      - SELKIES_ENCODER=h264enc
      - SELKIES_RENDER_DRI=/dev/dri/renderD128
      - DRI_NODE=/dev/dri/renderD128
      - SELKIES_WAYLAND=true
      - SELKIES_WAYLAND_COMPOSITOR=labwc
      - SELKIES_WAYLAND_OUTPUTS=1
      - SELKIES_MANUAL_WIDTH=3840
      - SELKIES_MANUAL_HEIGHT=2160
      - SELKIES_SCALING_DPI=144
      - SELKIES_UI_SHOW_SIDEBAR=false
      - TEDDY_PROXY_SERVER=http://gluetun:8888
      - TEDDY_START_URL=https://api.ipify.org
      - TEDDY_SELKIES_CONTROL_ENABLED=true
      - TEDDY_SELKIES_ROLE=desktop
    ports:
      - "192.168.1.155:58010:8080/tcp"
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "992"
    volumes:
      - /opt/missav-selkies-browser-config/chrome-profile:/config/chrome-profile:rw
      - /opt/missav-dlp-web/teddy-selkies-control:/run/secrets/teddy-selkies-control:ro
    shm_size: "2gb"
    mem_limit: "3g"
    memswap_limit: "3g"
    pids_limit: 512

  vpn-browser-mobile-selkies:
    image: ghcr.io/ssikgun/missav-dlp-web@sha256:9ce283f5f676dff47e78eb2e4bd6b10091b1678851f46df9f95a39bd67f8e6d5
    container_name: missav-vpn-browser-mobile-selkies
    hostname: missav-vpn-browser-mobile-selkies
    restart: unless-stopped
    depends_on:
      - gluetun
      - missav-dlp-web
    env_file:
      - /opt/missav-selkies-browser-config/selkies-auth.env
    environment:
      - SELKIES_ENABLE_BASIC_AUTH=false
      - TZ=Asia/Seoul
      - LIBVA_DRIVER_NAME=iHD
      - SELKIES_PORT=8080
      - SELKIES_MODE=websockets
      - SELKIES_ENCODER=h264enc
      - SELKIES_RENDER_DRI=/dev/dri/renderD128
      - DRI_NODE=/dev/dri/renderD128
      - SELKIES_WAYLAND=true
      - SELKIES_WAYLAND_COMPOSITOR=labwc
      - SELKIES_WAYLAND_OUTPUTS=1
      - SELKIES_MANUAL_WIDTH=720
      - SELKIES_MANUAL_HEIGHT=1300
      - SELKIES_SCALING_DPI=96
      - SELKIES_UI_SHOW_SIDEBAR=true
      - TEDDY_PROXY_SERVER=http://gluetun:8888
      - TEDDY_START_URL=https://api.ipify.org
      - TEDDY_SELKIES_CONTROL_ENABLED=true
      - TEDDY_SELKIES_ROLE=mobile
    ports:
      - "192.168.1.155:58011:8080/tcp"
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "992"
    volumes:
      - /opt/missav-selkies-mobile-browser-config/chrome-profile:/config/chrome-profile:rw
      - /opt/missav-dlp-web/teddy-selkies-control:/run/secrets/teddy-selkies-control:ro
    shm_size: "1gb"
    mem_limit: "2g"
    memswap_limit: "2g"
    pids_limit: 512
